name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Web UI — typecheck and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Agent core — unit tests
        working-directory: agent-android
        run: ./gradlew :core:test

      # Optional: a stable debug signing key, so each new APK installs over the previous one
      # (keeping pairing and permissions). See README "Stable signing key".
      - name: Install debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Agent app — build debug APK
        working-directory: agent-android
        run: ./gradlew :app:assembleDebug -PskipWebBuild

      - uses: actions/upload-artifact@v4
        with:
          name: dogwatch-agent-debug-apk
          path: agent-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: agent-android/core/build/reports/tests/
